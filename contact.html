<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Hare & Grouse</title>
<meta name="description" content="Get in touch with Hare & Grouse.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ojuju:wght@700&family=Sora:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<main class="shell">
<header class="phero"><div class="pattern fade"></div>
<span class="eyebrow reveal">Contact</span>
<h1 class="display" data-split>Let's Talk<br>About Art</h1>
<p class="lead reveal" data-d="2">Questions about a work, an exhibition or a programme? Write to us — a member of the team will reply.</p>
<div class="crumbs reveal" data-d="3"><a href="index.html">Home</a> / Contact</div></header>
<section class="section" style="padding-top:0"><div class="feature" style="align-items:start">
  <div class="grid" style="gap:14px">
    <a href="mailto:info@hareandgrouse.com" class="step reveal"><div class="n">@</div><h3 class="display">Email</h3><p>info@hareandgrouse.com</p></a>
    <div class="step reveal" data-d="1"><div class="n">◷</div><h3 class="display">Gallery hours</h3><p>Tuesday – Saturday, 10:00 – 18:00<br>Sunday &amp; Monday by appointment</p></div>
    <a href="https://hareandgrouse.com" class="step reveal" data-d="2"><div class="n">↗</div><h3 class="display">Online</h3><p>hareandgrouse.com</p></a>
  </div>
  <form class="form reveal" data-d="1" data-form>
    <div class="field"><input id="c1" placeholder=" " required><label for="c1">Name</label></div><div class="field"><input id="c2" type="email" placeholder=" " required><label for="c2">Email</label></div>
    <div class="field full"><select id="c3"><option>General enquiry</option><option>Acquisitions</option><option>Exhibiting</option><option>Education programmes</option><option>Press</option></select><label for="c3">Subject</label></div>
    <div class="field full"><textarea id="c4" placeholder=" " required></textarea><label for="c4">Message</label></div>
    <div class="full"><button class="btn btn-dark"><span class="ico"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9L9 3M4 3h5v5"/></svg></span>Send Message</button><p class="form-note"></p></div>
  </form>
</div></section>
</main>
<script src="js/main.js"></script>
</body>
</html>
